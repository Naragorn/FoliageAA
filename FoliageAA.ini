[Main]
; 1 = the plugin does its work, 0 = it does nothing.
; Needs antialiasing on in the Oblivion launcher (iMultiSample above 0);
; without it there are no samples to work with and nothing changes.
Enable=1

; Which vendor back door to use for coverage:
;   auto   - NVIDIA/Intel route when the driver reports 'ATOC' support, AMD route on AMD
;   nvidia - force the NVIDIA/Intel route (D3DRS_ADAPTIVETESS_Y = 'ATOC')
;   amd    - force the AMD route (D3DRS_POINTSIZE = 'A2M1'/'A2M0')
;   off    - no coverage at all (same as Enable=0 under [Coverage])
Mode=auto

[Leaves]
; How the trees' leaves are antialiased:
;   supersample - every leaf draw is issued in several passes, each writing
;                 one run of the antialiasing samples with the engine's own
;                 alpha test evaluated at that sample's place. Real
;                 supersampling of the leaf edges, no dithering, stable in a
;                 headset. Costs the leaf drawing that many times over.
;   coverage    - alpha-to-coverage with the leaf shaders sharpened around the
;                 engine's alpha threshold. Cheaper; on NVIDIA under DXVK the
;                 coverage is dithered, which glitters in VR at a distance.
Method=supersample

; Supersampling passes, 1 to 8. 8 on 8x antialiasing gives every sample its
; own alpha test; 4 halves the cost with two samples per pass. 1 draws the
; leaves plainly.
Passes=8

; Coverage method only. The plugin hands the engine a copy of the two leaf
; shaders that sharpens the alpha around a threshold before it becomes
; coverage: alpha' = saturate((alpha - Threshold) * Steepness + 0.5).
SharpenLeaves=1
; "engine" follows the alpha test reference the engine sets for each leaf
; draw (seen from 84 to 159 of 255); a number between 0 and 1 fixes it.
Threshold=engine
; How hard the sharpened edge is (1..64).
Steepness=4.0

[Coverage]
; 1 = alpha-to-coverage for every alpha-tested draw: grass, hair, fences, and
; the leaves when Method=coverage. 0 = none, those surfaces draw as the game
; draws them. Off by default: under DXVK on NVIDIA the coverage is dithered,
; and in a headset that made hair glitter up close (2026-10-08).
Enable=0

[Diagnostics]
; 1 = write every pixel shader the engine sets into FoliageAA-shaders\ in the
; game folder, once each, and log the render states of that first moment.
; For finding out which shader draws what. Leave at 0 for play.
DumpShaders=0
