[Main]
; 1 = alpha-to-coverage on for alpha-tested surfaces (leaves, grass, hair, fences),
; 0 = the plugin does nothing.
; Needs antialiasing on in the Oblivion launcher (iMultiSample above 0);
; without it there are no coverage samples and nothing changes.
Enable=1

; Which vendor back door to use:
;   auto   - NVIDIA/Intel route when the driver reports 'ATOC' support, AMD route on AMD
;   nvidia - force the NVIDIA/Intel route (D3DRS_ADAPTIVETESS_Y = 'ATOC')
;   amd    - force the AMD route (D3DRS_POINTSIZE = 'A2M1'/'A2M0')
;   off    - same as Enable=0
Mode=auto

[Leaves]
; Coverage is alpha, one to one, and at a distance the leaf textures' mipmaps
; average leaf and gap to an alpha well below 1 - the leaves go see-through.
; With this on, the plugin hands the engine a copy of the two leaf shaders
; that sharpens the alpha around a threshold before it becomes coverage:
;   alpha' = saturate((alpha - Threshold) * Steepness + 0.5)
; 1 = on, 0 = leaf alpha goes to coverage as the texture has it.
SharpenLeaves=1

; Where a pixel counts as leaf. "engine" follows the alpha test reference the
; engine sets for each leaf draw (seen: 84 of 255, 0.33), which keeps the cut
; where the old alpha test cut. A number between 0 and 1 fixes it instead.
Threshold=engine

; How hard the edge is (1..64). 4 leaves a soft band a quarter of the alpha
; range wide; higher is crisper and closer to the old alpha test.
Steepness=4.0

[Diagnostics]
; 1 = write every pixel shader the engine sets into FoliageAA-shaders\ in the
; game folder, once each, and log the render states of that first moment.
; For finding out which shader draws what. Leave at 0 for play.
DumpShaders=0
